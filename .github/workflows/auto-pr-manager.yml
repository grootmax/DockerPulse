name: Auto PR Manager

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize

  schedule:
    - cron: "*/5 * * * *"

  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  detect-prs:
    runs-on: ubuntu-latest

    steps:
      - name: List open pull requests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          echo "Checking open PRs..."

          gh pr list \
            --repo "$GH_REPO" \
            --state open \
            --json number,title,headRefName,baseRefName,isDraft,mergeable \
            --limit 100
